<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتيجة النفط والغاز - الصيف 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root{
    --primary:#4F46E5; --secondary:#6366F1; --accent:#7C3AED;
    --bg:#F8FAFC; --card:rgba(255,255,255,.75); --border:rgba(255,255,255,.55);
    --text:#111827; --muted:#6B7280;
    --grad:linear-gradient(135deg,#4F46E5 0%,#6366F1 50%,#7C3AED 100%);
    --line:rgba(79,70,229,.14); --ok:#059669; --fail:#DC2626;
    --shadow:0 20px 50px -12px rgba(79,70,229,.22);
    --shadow-sm:0 8px 24px -8px rgba(17,24,39,.14);
    --radius:26px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Cairo','Segoe UI',sans-serif;color:var(--text);position:relative;
       background:var(--bg);min-height:100%;padding:20px 14px 48px;overflow-x:hidden;
       -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;
       filter:blur(90px);opacity:.5;pointer-events:none;}
  body::before{width:460px;height:460px;top:-160px;right:-120px;
       background:radial-gradient(circle,#818CF8 0%,rgba(124,58,237,0) 70%);}
  body::after{width:520px;height:520px;bottom:-200px;left:-160px;
       background:radial-gradient(circle,#A78BFA 0%,rgba(99,102,241,0) 70%);}
  .blob{position:fixed;z-index:0;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;
       width:300px;height:300px;top:38%;left:50%;transform:translateX(-50%);
       background:radial-gradient(circle,#C4B5FD 0%,rgba(196,181,253,0) 70%);}
  .sheet{position:relative;z-index:1;max-width:680px;margin:0 auto;
         background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
         border:1px solid var(--border);border-radius:var(--radius);
         box-shadow:var(--shadow);padding:22px 22px 30px;animation:fadeIn .6s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .uni{display:flex;align-items:center;gap:12px;padding:16px;border-radius:20px;
       background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,.28));
       border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .uni img{width:60px;height:60px;object-fit:cover;border-radius:50%;flex:0 0 auto;
           border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 16px rgba(79,70,229,.25);}
  .uni .titles{flex:1;text-align:center;line-height:1.5;}
  .uni .titles h1{font-size:20px;font-weight:900;
       background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .uni .titles h2{color:var(--muted);font-size:13.5px;font-weight:700;margin-top:3px;}
  .hero{text-align:center;margin-top:26px;animation:slideUp .5s ease both;}
  .hero .badge{display:inline-flex;align-items:center;gap:8px;background:var(--grad);
       color:#fff;font-weight:800;font-size:14px;padding:9px 20px;border-radius:999px;
       box-shadow:0 10px 30px rgba(79,70,229,.35);}
  .hero h3{margin-top:16px;font-size:22px;font-weight:900;}
  .hero p{color:var(--muted);font-size:14px;margin-top:6px;}
  .search{margin-top:22px;display:flex;flex-direction:column;gap:12px;}
  .field{position:relative;}
  .field i{position:absolute;top:50%;right:18px;transform:translateY(-50%);color:var(--primary);font-size:20px;}
  .field input{width:100%;padding:16px 52px 16px 18px;font-family:inherit;font-size:17px;font-weight:700;
       border:2px solid var(--line);border-radius:16px;background:rgba(255,255,255,.7);color:var(--text);
       direction:ltr;text-align:right;transition:.2s;outline:none;}
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.12);}
  .btn{width:100%;padding:16px;border:none;border-radius:16px;background:var(--grad);color:#fff;
       font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;
       justify-content:center;gap:10px;box-shadow:0 12px 30px rgba(79,70,229,.35);transition:transform .15s;}
  .btn:active{transform:scale(.98);}
  .msg{margin-top:16px;padding:16px;border-radius:14px;font-weight:700;text-align:center;font-size:15px;display:none;}
  .msg.show{display:block;animation:scaleIn .3s ease both;}
  .msg.err{background:rgba(220,38,38,.1);color:var(--fail);border:1px solid rgba(220,38,38,.25);}
  .msg.warn{background:rgba(217,119,6,.1);color:#B45309;border:1px solid rgba(217,119,6,.28);}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);
       border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
  .result{margin-top:22px;display:none;}
  .result.show{display:block;animation:slideUp .45s ease both;}
  .std{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.35));
       border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow-sm);}
  .std .name{font-size:20px;font-weight:900;text-align:center;}
  .std .meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .std .chip{background:rgba(79,70,229,.1);color:var(--primary);border:1px solid rgba(79,70,229,.2);
       padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:800;direction:ltr;unicode-bidi:isolate;}
  table{width:100%;border-collapse:collapse;margin-top:18px;background:rgba(255,255,255,.55);
       border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
  thead th{background:var(--grad);color:#fff;padding:12px 8px;font-size:13.5px;font-weight:800;}
  tbody td{padding:12px 8px;text-align:center;font-size:14px;font-weight:700;border-top:1px solid var(--line);}
  tbody td.cn{text-align:right;font-weight:700;direction:ltr;}
  tbody tr:nth-child(even){background:rgba(79,70,229,.04);}
  .g{direction:ltr;unicode-bidi:isolate;font-weight:800;}
  .lt{display:inline-block;min-width:34px;padding:3px 8px;border-radius:8px;font-weight:900;font-size:13px;
       background:rgba(5,150,105,.12);color:var(--ok);direction:ltr;}
  .lt.f{background:rgba(220,38,38,.12);color:var(--fail);}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .box{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.35));
       border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow-sm);}
  .box .k{color:var(--muted);font-size:12.5px;font-weight:700;}
  .box .v{font-size:22px;font-weight:900;margin-top:4px;direction:ltr;unicode-bidi:isolate;
       background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .box.full{grid-column:1/-1;}
  .box.full .v{font-size:20px;}
  .credit{text-align:center;margin-top:22px;color:var(--muted);font-size:13px;font-weight:700;}
  .back{margin-top:16px;text-align:center;}
  .back button{background:none;border:none;color:var(--primary);font-family:inherit;font-weight:800;
       font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  @media(max-width:520px){.uni .titles h1{font-size:17px;}.hero h3{font-size:19px;}}
</style>
</head>

let BLOCK = (["25E008", "25E009", "25E013", "25E014", "25E023", "25E024", "25E025", "25E026", "25E029", "25E032", "25E033", "25E037", "25E038", "25E047", "25E049", "25E051", "25E059", "25E065", "26E065", "25P009", "25P019", "25P044", "25P054", "25P055", "25P081", "25P082", "25P084", "25P111", "25P114", "25P115", "25PT006", "25L060", "25L073", "26P111", "26P114", "26P115"]).map(x=>String(x).toUpperCase().trim());
const BLOB = 'block.json';

const IDX = {};
DATA.forEach(s=>{ IDX[String(s.roll).toUpperCase().trim()] = s; });

function letterOf(g){
  if(g==null) return {t:'-',f:false};
  g=Number(g);
  if(g>=85) return {t:'A',f:false};
  if(g>=80) return {t:'B+',f:false};
  if(g>=75) return {t:'B',f:false};
  if(g>=70) return {t:'C+',f:false};
  if(g>=65) return {t:'C',f:false};
  if(g>=60) return {t:'D+',f:false};
  if(g>=50) return {t:'D',f:false};
  return {t:'F',f:true};
}

async function refreshBlock(){
  try{
    const r = await fetch(BLOB+'?t='+Date.now(), {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(Array.isArray(j)) BLOCK = j.map(x=>String(x).toUpperCase().trim());
    }
  }catch(e){}
}

function showMsg(cls,txt){
  const m=document.getElementById('msg');
  m.className='msg show '+cls; m.innerHTML=txt;
}
function hideMsg(){ document.getElementById('msg').className='msg'; }

async function go(){
  const raw = document.getElementById('roll').value.toUpperCase().trim();
  const btn = document.getElementById('goBtn');
  if(!raw){ showMsg('err','<i class="bi bi-exclamation-circle"></i> الرجاء إدخال الرقم الدراسي'); return; }
  btn.innerHTML='<span class="spin"></span> جاري البحث...';
  await refreshBlock();
  btn.innerHTML='<i class="bi bi-search"></i> عرض النتيجة';

  if(BLOCK.includes(raw)){
    hideMsg();
    showMsg('warn','<i class="bi bi-lock-fill"></i> نتيجتك محجوبة حالياً. الرجاء مراجعة قسم المالية بالجامعة.');
    document.getElementById('result').className='result';
    return;
  }
  const s = IDX[raw];
  if(!s){
    showMsg('err','<i class="bi bi-x-circle"></i> لا توجد نتيجة بهذا الرقم في قسم النفط والغاز (الصيف 2026).');
    document.getElementById('result').className='result';
    return;
  }
  hideMsg();
  render(s);
}

function render(s){
  document.getElementById('searchView').style.display='none';
  let rows='';
  s.courses.forEach(c=>{
    const L=letterOf(c.grade);
    rows += '<tr><td class="cn">'+c.course+'</td>'
          + '<td class="g">'+(c.grade==null?'-':c.grade)+'</td>'
          + '<td><span class="lt'+(L.f?' f':'')+'">'+L.t+'</span></td></tr>';
  });
  const warn = s.warnings||0;
  const html =
    '<div class="std">'
    + '<div class="name">'+s.name+'</div>'
    + '<div class="meta">'
    +   '<span class="chip"><i class="bi bi-hash"></i>'+s.roll+'</span>'
    +   (s.letter?'<span class="chip">التقدير العام: '+s.letter+'</span>':'')
    +   '<span class="chip">الإنذارات: '+warn+'</span>'
    + '</div>'
    + '<table>'
    +   '<thead><tr><th>المقرر</th><th>الدرجة</th><th>التقدير</th></tr></thead>'
    +   '<tbody>'+rows+'</tbody>'
    + '</table>'
    + '<div class="summary">'
    +   '<div class="box"><div class="k">المعدل الفصلي</div><div class="v">'+(s.semAvg!=null?s.semAvg+'%':'-')+'</div></div>'
    +   '<div class="box"><div class="k">المعدل التراكمي</div><div class="v">'+(s.cumAvg!=null?s.cumAvg+'%':'-')+'</div></div>'
    +   (s.rating?'<div class="box full"><div class="k">التقدير</div><div class="v">'+s.rating+'</div></div>':'')
    + '</div>'
    + '</div>'
    + '<div class="back"><button onclick="backHome()"><i class="bi bi-arrow-right"></i> بحث عن طالب آخر</button></div>'
    + '<div class="credit"><i class="bi bi-pen-fill"></i> تصميم: م. عُمر مراجع</div>';
  const r=document.getElementById('result');
  r.innerHTML=html; r.className='result show';
}

function backHome(){
  document.getElementById('result').className='result';
  document.getElementById('searchView').style.display='';
  document.getElementById('roll').value='';
  hideMsg();
  document.getElementById('roll').focus();
}

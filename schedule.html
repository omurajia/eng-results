<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول المحاضرات - خريف 2026/2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root{
    --primary:#0D9488; --secondary:#14B8A6; --accent:#0891B2;
    --bg:#F3FBFA; --card:rgba(255,255,255,.78); --border:rgba(255,255,255,.6);
    --text:#0F2A2A; --muted:#5B7B78;
    --grad:linear-gradient(135deg,#0D9488 0%,#14B8A6 45%,#0891B2 100%);
    --line:rgba(13,148,136,.15); --ok:#059669;
    --shadow:0 20px 50px -12px rgba(13,148,136,.26);
    --shadow-sm:0 8px 24px -8px rgba(15,42,42,.14);
    --radius:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:'Cairo','Segoe UI',sans-serif;color:var(--text);position:relative;
       background:var(--bg);min-height:100%;padding:20px 14px 48px;overflow-x:hidden;
       -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;
       filter:blur(90px);opacity:.5;pointer-events:none;}
  body::before{width:460px;height:460px;top:-160px;right:-120px;
       background:radial-gradient(circle,#5EEAD4 0%,rgba(8,145,178,0) 70%);}
  body::after{width:520px;height:520px;bottom:-200px;left:-160px;
       background:radial-gradient(circle,#67E8F9 0%,rgba(13,148,136,0) 70%);}
  .blob{position:fixed;z-index:0;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;
       width:300px;height:300px;top:38%;left:50%;transform:translateX(-50%);
       background:radial-gradient(circle,#99F6E4 0%,rgba(153,246,228,0) 70%);}
  .sheet{position:relative;z-index:1;max-width:720px;margin:0 auto;
         background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
         border:1px solid var(--border);border-radius:var(--radius);
         box-shadow:var(--shadow);padding:22px 22px 30px;animation:fadeIn .6s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes slideUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .uni{display:flex;align-items:center;gap:12px;padding:16px;border-radius:20px;
       background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,.28));
       border:1px solid var(--border);box-shadow:var(--shadow-sm);}
  .uni img{width:60px;height:60px;object-fit:cover;border-radius:50%;flex:0 0 auto;
           border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 16px rgba(13,148,136,.25);}
  .uni .titles{flex:1;text-align:center;line-height:1.5;}
  .uni .titles h1{font-size:20px;font-weight:900;
       background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .uni .titles h2{color:var(--muted);font-size:13.5px;font-weight:700;margin-top:3px;}
  .hero{text-align:center;margin-top:26px;animation:slideUp .5s ease both;}
  .hero .badge{display:inline-flex;align-items:center;gap:8px;background:var(--grad);
       color:#fff;font-weight:800;font-size:14px;padding:9px 20px;border-radius:999px;
       box-shadow:0 10px 30px rgba(13,148,136,.35);}
  .hero h3{margin-top:16px;font-size:22px;font-weight:900;}
  .hero p{color:var(--muted);font-size:14px;margin-top:6px;}
  .search{margin-top:22px;display:flex;flex-direction:column;gap:12px;}
  .field{position:relative;}
  .field i{position:absolute;top:50%;right:18px;transform:translateY(-50%);color:var(--primary);font-size:20px;}
  .field input{width:100%;padding:16px 52px 16px 18px;font-family:inherit;font-size:17px;font-weight:700;
       border:2px solid var(--line);border-radius:16px;background:rgba(255,255,255,.7);color:var(--text);
       direction:ltr;text-align:right;transition:.2s;outline:none;}
  .field input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(13,148,136,.12);}
  .btn{width:100%;padding:16px;border:none;border-radius:16px;background:var(--grad);color:#fff;
       font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;
       justify-content:center;gap:10px;box-shadow:0 12px 30px rgba(13,148,136,.35);transition:transform .15s;}
  .btn:active{transform:scale(.98);}
  .msg{margin-top:16px;padding:16px;border-radius:14px;font-weight:700;text-align:center;font-size:15px;display:none;}
  .msg.show{display:block;animation:scaleIn .3s ease both;}
  .msg.err{background:rgba(220,38,38,.1);color:#DC2626;border:1px solid rgba(220,38,38,.25);}
  .result{margin-top:22px;display:none;}
  .result.show{display:block;animation:slideUp .45s ease both;}
  .std{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.35));
       border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow-sm);}
  .std .name{font-size:20px;font-weight:900;text-align:center;}
  .std .meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;}
  .std .chip{background:rgba(13,148,136,.1);color:var(--primary);border:1px solid rgba(13,148,136,.2);
       padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;}
  .std .chip.ltr{direction:ltr;unicode-bidi:isolate;}
  .day{margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;
       background:rgba(255,255,255,.55);box-shadow:var(--shadow-sm);}
  .day .dh{background:var(--grad);color:#fff;padding:10px 16px;font-weight:900;font-size:15px;
       display:flex;align-items:center;gap:8px;}
  .slot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);}
  .slot:first-of-type{border-top:none;}
  .slot .time{flex:0 0 auto;text-align:center;min-width:70px;direction:ltr;unicode-bidi:isolate;}
  .slot .time .s{font-weight:900;font-size:14.5px;color:var(--primary);}
  .slot .time .e{font-size:12px;color:var(--muted);font-weight:700;}
  .slot .body{flex:1;min-width:0;}
  .slot .body .c{font-weight:800;font-size:15px;line-height:1.35;}
  .slot .body .c-en{font-weight:700;font-size:12.5px;line-height:1.3;color:var(--accent);
       direction:ltr;unicode-bidi:isolate;text-align:right;margin-top:1px;}
  .slot .body .sub{color:var(--muted);font-size:12.5px;font-weight:700;margin-top:5px;
       display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tp{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;
       background:rgba(8,145,178,.12);color:var(--accent);}
  .tp.lab{background:rgba(5,150,105,.12);color:var(--ok);}
  .cid{direction:ltr;unicode-bidi:isolate;font-weight:700;}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .box{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.35));
       border:1px solid var(--border);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow-sm);}
  .box .k{color:var(--muted);font-size:12.5px;font-weight:700;}
  .box .v{font-size:22px;font-weight:900;margin-top:4px;direction:ltr;unicode-bidi:isolate;
       background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .credit{text-align:center;margin-top:22px;color:var(--muted);font-size:13px;font-weight:700;}
  .back{margin-top:16px;text-align:center;}
  .back button{background:none;border:none;color:var(--primary);font-family:inherit;font-weight:800;
       font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  @media print{.search,.back,.hero .badge{display:none;}body{background:#fff;}}
  @media(max-width:600px){
    body{padding:14px 10px 40px;}
    .sheet{padding:16px 13px 24px;border-radius:20px;}
    .uni{padding:12px;gap:10px;}
    .uni img{width:50px;height:50px;}
    .uni .titles h1{font-size:16px;}
    .uni .titles h2{font-size:12px;}
    .hero{margin-top:20px;}
    .hero h3{font-size:19px;}
    .hero p{font-size:13px;}
    .field input{font-size:16px;padding:14px 46px 14px 14px;}
    .btn{font-size:16px;padding:15px;}
    .std{padding:14px;}
    .std .name{font-size:18px;}
    .std .chip{font-size:12px;padding:5px 11px;}
    .day .dh{font-size:14px;padding:9px 13px;}
    .slot{padding:11px 12px;gap:10px;align-items:flex-start;}
    .slot .time{min-width:52px;}
    .slot .time .s{font-size:14px;}
    .slot .time .e{font-size:11px;}
    .slot .body .c{font-size:14px;}
    .slot .body .c-en{font-size:11.5px;}
    .slot .body .sub{font-size:11.5px;gap:6px;}
    .box .v{font-size:20px;}
    .back button{font-size:13.5px;}
  }
  @media(max-width:360px){
    .slot{flex-direction:column;gap:4px;}
    .slot .time{min-width:0;text-align:right;display:flex;gap:6px;align-items:baseline;}
    .slot .time .e::before{content:"-";margin-left:4px;}
  }
</style>
</head>

function hideMsg(){document.getElementById('msg').className='msg';}

function go(){
  const raw=document.getElementById('roll').value.toUpperCase().trim();
  if(!raw){showMsg('err','<i class="bi bi-exclamation-circle"></i> الرجاء إدخال الرقم الدراسي');return;}
  const s=DATA[raw];
  if(!s){
    showMsg('err','<i class="bi bi-x-circle"></i> لا يوجد جدول محاضرات بهذا الرقم للفصل الحالي.');
    document.getElementById('result').className='result';
    return;
  }
  hideMsg(); render(s);
}

function render(s){
  document.getElementById('searchView').style.display='none';
  // group by day
  const byday={};
  s.items.forEach(it=>{(byday[it.day]=byday[it.day]||[]).push(it);});
  let days='';
  DAY_ORDER.forEach(d=>{
    if(!byday[d]) return;
    let slots='';
    byday[d].forEach(it=>{
      const isLab=(it.type||'').indexOf('عمل')>=0;
      const tp=it.type?('<span class="tp'+(isLab?' lab':'')+'">'+it.type+'</span>'):'';
      const cid=it.course_id?('<span class="cid">'+it.course_id+'</span>'):'';
      const room=it.room?('<span><i class="bi bi-geo-alt"></i> '+it.room+'</span>'):'';
      const te=it.teacher?('<span><i class="bi bi-person"></i> '+it.teacher+'</span>'):'';
      const ar=it.course?('<div class="c">'+it.course+'</div>'):'';
      const en=(it.course_en && it.course_en!==it.course)?('<div class="c-en">'+it.course_en+'</div>'):'';
      slots+='<div class="slot">'
        +'<div class="time"><div class="s">'+it.start+'</div><div class="e">'+it.end+'</div></div>'
        +'<div class="body">'+ar+en
        +'<div class="sub">'+tp+cid+room+te+'</div></div></div>';
    });
    days+='<div class="day"><div class="dh"><i class="bi bi-calendar-day"></i> '+DAYS_AR[d]+'</div>'+slots+'</div>';
  });
  const ndays=Object.keys(byday).length;
  const html='<div class="std">'
    +'<div class="name">'+s.name+'</div>'
    +'<div class="meta">'
    +'<span class="chip ltr"><i class="bi bi-hash"></i>'+s.roll+'</span>'
    +(s.college?'<span class="chip">'+s.college+'</span>':'')
    +'</div>'
    +'<div class="summary">'
    +'<div class="box"><div class="k">عدد المحاضرات</div><div class="v">'+s.items.length+'</div></div>'
    +'<div class="box"><div class="k">أيام الدوام</div><div class="v">'+ndays+'</div></div>'
    +'</div>'
    +days
    +'</div>'
    +'<div class="back"><button onclick="backHome()"><i class="bi bi-arrow-right"></i> بحث عن طالب آخر</button>'
    +' &nbsp; <button onclick="window.print()"><i class="bi bi-printer"></i> طباعة</button></div>'
    +'<div class="credit"><i class="bi bi-pen-fill"></i> تصميم: م. عُمر مراجع</div>';
  const r=document.getElementById('result');
  r.innerHTML=html; r.className='result show';
}

function backHome(){
  document.getElementById('result').className='result';
  document.getElementById('searchView').style.display='';
  document.getElementById('roll').value='';
  hideMsg();
  document.getElementById('roll').focus();
}
</script>
</body>
</html>
